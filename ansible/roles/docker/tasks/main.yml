---
- name: Install Docker
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes
  notify: Start Docker

- name: Ensure Docker is running
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes
