---
- name: Configure sysctl for network
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop:
    - { key: net.ipv4.ip_forward, value: "1" }
    - { key: net.core.rmem_max, value: "2500000" }
    - { key: net.core.wmem_max, value: "2500000" }

- name: Set timezone to Asia/Karachi
  timezone:
    name: Asia/Karachi

- name: Install monitoring tools
  apt:
    name:
      - prometheus-node-exporter
      - htop
      - iotop
      - net-tools
    state: present
