---
- name: Setup EC2 for AIOS
  hosts: all
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - docker
    - ec2-setup
    - aios-directories

  tasks:
    - name: Check if git repo exists
      stat:
        path: /aios/.git
      register: git_dir

    - name: Clone AIOS repository
      git:
        repo: https://github.com/cts24/aios.git
        dest: /aios
        version: master
      when: not git_dir.stat.exists

    - name: Set env file permissions
      file:
        path: "/aios/{{ env_file }}"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Create Docker networks for EC2 #1 (AI Core)
      community.docker.docker_network:
        name: "{{ item }}"
        driver: bridge
      loop:
        - dmz-net
        - ai-net
        - monitoring-net
      when: role == "ai-core"

    - name: Create Docker network for EC2 #2 (Data)
      community.docker.docker_network:
        name: data-net
        driver: bridge
      when: role == "data"

    - name: Create Docker networks for EC2 #3 (Voice+Vision)
      community.docker.docker_network:
        name: "{{ item }}"
        driver: bridge
      loop:
        - voice-net
        - vision-net
      when: role == "voice-vision"

    - name: Create Docker networks for EC2 #4 (Apps)
      community.docker.docker_network:
        name: "{{ item }}"
        driver: bridge
      loop:
        - app-net
        - identity-net
      when: role == "apps"

    - name: Deploy Docker stack
      community.docker.docker_compose_v2:
        project_src: /aios
        files:
          - "{{ compose_file }}"
        state: present
        pull: always
      when: compose_file is defined
