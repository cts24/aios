[general]
context=public
allowoverlap=no
udpbindaddr=0.0.0.0:5060
transport=udp
srvlookup=yes
language=en

[office-phone]
type=friend
host=office-public-ip
secret=${SIP_OFFICE_SECRET}
context=internal
qualify=yes
nat=force_rport,comedia
directmedia=no
dtmfmode=rfc2833
canreinvite=no

[1001](office-phone)
mailbox=1001@default

[1002](office-phone)
mailbox=1002@default

[1003](office-phone)
mailbox=1003@default
