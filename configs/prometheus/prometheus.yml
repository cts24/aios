global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["10.10.0.10:8080"]

  - job_name: "node"
    static_configs:
      - targets: ["10.0.1.10:9100", "10.0.2.10:9100"]

  - job_name: "docker"
    static_configs:
      - targets: ["10.0.1.10:9323"]
