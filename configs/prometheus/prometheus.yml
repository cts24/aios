global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["10.10.0.10:8080"]

  - job_name: "node"
    static_configs:
      - targets: ["172.31.11.45:9100", "172.31.66.54:9100", "172.31.64.70:9100", "172.31.79.159:9100"]

  - job_name: "docker"
    static_configs:
      - targets: ["172.31.4.81:9323"]
