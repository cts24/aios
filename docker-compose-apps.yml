version: "3.9"

name: aios-apps

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.70.0.0/24
  identity-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.80.0.0/24

services:
  # ────────────────────────────────────────────
  # TIER 2 — IDENTITY & SECRETS
  # ────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    restart: unless-stopped
    networks:
      identity-net:
        ipv4_address: 10.80.0.10
    env_file:
      - .env.apps
    volumes:
      - ./configs/keycloak:/opt/keycloak/data/import
    command: start-dev --import-realm
    ports:
      - "8080:8080"

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    networks:
      identity-net:
        ipv4_address: 10.80.0.20
    env_file:
      - .env.apps
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  paperclip:
    image: paperclip/paperclip:latest
    container_name: paperclip
    restart: unless-stopped
    networks:
      identity-net:
        ipv4_address: 10.80.0.30
    depends_on:
      - keycloak
    env_file:
      - .env.apps
    ports:
      - "3002:3000"

  # ────────────────────────────────────────────
  # ERP & FINANCE
  # ────────────────────────────────────────────

  odoo:
    image: odoo:18
    container_name: odoo
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.10
    depends_on:
      - odoo-db
    env_file:
      - .env.apps
    volumes:
      - odoo-data:/var/lib/odoo
      - ./configs/odoo:/etc/odoo
    ports:
      - "8069:8069"

  odoo-db:
    image: postgres:16-alpine
    container_name: odoo-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  erpnext:
    image: frappe/erpnext:latest
    container_name: erpnext
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.20
    depends_on:
      - erpnext-db
      - erpnext-redis
    env_file:
      - .env.apps
    volumes:
      - erpnext-data:/home/frappe/frappe-bench/sites
    ports:
      - "8001:8000"

  erpnext-db:
    image: mariadb:10.11
    container_name: erpnext-db
    restart: unless-stopped
    networks:
      app-net:
    env_file:
      - .env.apps
    volumes:
      - erpnext-db-data:/var/lib/mysql

  erpnext-redis:
    image: redis:7-alpine
    container_name: erpnext-redis
    restart: unless-stopped
    networks:
      app-net:

  # ────────────────────────────────────────────
  # CRM
  # ────────────────────────────────────────────

  twenty-crm:
    image: twentysix/twenty:latest
    container_name: twenty-crm
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.30
    depends_on:
      - twenty-crm-db
    env_file:
      - .env.apps
    volumes:
      - twenty-crm-data:/app/data
    ports:
      - "3003:3000"

  twenty-crm-db:
    image: postgres:16-alpine
    container_name: twenty-crm-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD}
    volumes:
      - twenty-crm-db-data:/var/lib/postgresql/data

  suitecrm:
    image: bitnami/suitecrm:latest
    container_name: suitecrm
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.35
    depends_on:
      - suitecrm-db
    env_file:
      - .env.apps
    volumes:
      - suitecrm-data:/bitnami
    ports:
      - "8081:80"

  suitecrm-db:
    image: mariadb:10.11
    container_name: suitecrm-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      MYSQL_DATABASE: suitecrm
      MYSQL_USER: suitecrm
      MYSQL_PASSWORD: ${SUITECRM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SUITECRM_ROOT_PASSWORD}
    volumes:
      - suitecrm-db-data:/var/lib/mysql

  # ────────────────────────────────────────────
  # PRODUCTIVITY & COLLABORATION
  # ────────────────────────────────────────────

  calcom:
    image: calcom/calcom:latest
    container_name: calcom
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.40
    depends_on:
      - calcom-db
    env_file:
      - .env.apps
    volumes:
      - calcom-data:/calcom/data
    ports:
      - "3004:3000"

  calcom-db:
    image: postgres:16-alpine
    container_name: calcom-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      POSTGRES_DB: calcom
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${CALCOM_DB_PASSWORD}
    volumes:
      - calcom-db-data:/var/lib/postgresql/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.50
    depends_on:
      - paperless-db
    env_file:
      - .env.apps
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
    ports:
      - "8082:8000"

  paperless-db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - paperless-db-data:/var/lib/postgresql/data

  docuseal:
    image: docuseal/docuseal:latest
    container_name: docuseal
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.55
    env_file:
      - .env.apps
    volumes:
      - docuseal-data:/data
    ports:
      - "3005:3000"

  planka:
    image: plagron/planka:latest
    container_name: planka
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.60
    env_file:
      - .env.apps
    volumes:
      - planka-data:/app/data
    ports:
      - "3006:1337"

  rocketchat:
    image: rocketchat/rocket.chat:latest
    container_name: rocketchat
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.65
    depends_on:
      - rocketchat-db
    env_file:
      - .env.apps
    volumes:
      - rocketchat-data:/app/uploads
    ports:
      - "3007:3000"

  rocketchat-db:
    image: bitnami/mongodb:7.0
    container_name: rocketchat-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      MONGODB_DATABASE: rocketchat
      MONGODB_USERNAME: rocketchat
      MONGODB_PASSWORD: ${ROCKETCHAT_DB_PASSWORD}
      MONGODB_ROOT_PASSWORD: ${ROCKETCHAT_ROOT_PASSWORD}
    volumes:
      - rocketchat-db-data:/bitnami/mongodb

  # ────────────────────────────────────────────
  # ANALYTICS & REPORTING
  # ────────────────────────────────────────────

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.70
    depends_on:
      - metabase-db
    env_file:
      - .env.apps
    volumes:
      - metabase-data:/metabase.db
    ports:
      - "3008:3000"

  metabase-db:
    image: postgres:16-alpine
    container_name: metabase-db
    restart: unless-stopped
    networks:
      app-net:
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data

  # ────────────────────────────────────────────
  # VOICE UI (Issabel)
  # ────────────────────────────────────────────

  issabel:
    image: issabel/issabel:latest
    container_name: issabel
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.80
      identity-net:
    depends_on:
      - keycloak
    volumes:
      - ./configs/issabel:/etc/issabel
    ports:
      - "8083:80"
      - "4443:443"

  # ────────────────────────────────────────────
  # CENTRAL MCP SERVER
  # ────────────────────────────────────────────

  central-mcp:
    image: node:20-alpine
    container_name: central-mcp
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.90
      identity-net:
    working_dir: /app
    volumes:
      - ./configs/mcp-server:/app
    command: sh -c "npm install && node server.js"
    env_file:
      - .env.apps
    ports:
      - "3100:3100"

  # ────────────────────────────────────────────
  # Frappe LMS (optional — requires bench)
  # ────────────────────────────────────────────

  frappe-lms:
    image: frappe/erpnext:latest
    container_name: frappe-lms
    restart: unless-stopped
    networks:
      app-net:
        ipv4_address: 10.70.0.95
    depends_on:
      - erpnext-db
      - erpnext-redis
    env_file:
      - .env.apps
    volumes:
      - frappe-lms-data:/home/frappe/frappe-bench/sites
    ports:
      - "8002:8000"

volumes:
  vault-data:
  odoo-data:
  odoo-db-data:
  erpnext-data:
  erpnext-db-data:
  twenty-crm-data:
  twenty-crm-db-data:
  suitecrm-data:
  suitecrm-db-data:
  calcom-data:
  calcom-db-data:
  paperless-data:
  paperless-media:
  paperless-db-data:
  docuseal-data:
  planka-data:
  rocketchat-data:
  rocketchat-db-data:
  metabase-data:
  metabase-db-data:
  frappe-lms-data:
