name: aios-ec1

networks:
  dmz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  ai-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  monitoring-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.60.0.0/24

services:
  # ── SECURITY (DMZ) ──
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    networks:
      dmz-net:
        ipv4_address: 10.10.0.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /aios/configs/traefik:/etc/traefik

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    networks:
      dmz-net:
        ipv4_address: 10.10.0.20
    volumes:
      - /aios/configs/crowdsec:/etc/crowdsec
      - /var/log:/var/log:ro
      - crowdsec-data:/var/lib/crowdsec/data

  # ── AI GATEWAY ──
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    networks:
      ai-net:
        ipv4_address: 10.20.0.10
    env_file:
      - /aios/.env.ec1
    volumes:
      - /aios/configs/bifrost:/app/config
    ports:
      - "4000:4000"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      ai-net:
        ipv4_address: 10.20.0.20
    depends_on:
      - litellm
    env_file:
      - /aios/.env.ec1
    volumes:
      - /aios/n8n:/home/node/.n8n
    ports:
      - "5678:5678"

  n8n-worker:
    image: n8nio/n8n:latest
    container_name: n8n-worker
    restart: unless-stopped
    networks:
      ai-net:
    depends_on:
      - litellm
    env_file:
      - /aios/.env.ec1
    command: worker --concurrency=10

  # ── MONITORING ──
  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.10
    env_file:
      - /aios/.env.ec1
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.20
    volumes:
      - /aios/configs/prometheus:/etc/prometheus
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.30
    depends_on:
      - prometheus
      - loki
    env_file:
      - /aios/.env.ec1
    volumes:
      - /aios/configs/grafana:/etc/grafana
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.40
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - /aios/configs/loki:/etc/loki
      - loki-data:/loki

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.50
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    ports:
      - "9000:9000"

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.70
    volumes:
      - /aios/configs/dashy:/app/public/conf

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.80
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3002:3001"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    networks:
      monitoring-net:
        ipv4_address: 10.60.0.90
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      monitoring-net:
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  portainer-data:
  uptime-kuma-data:
  crowdsec-data:
