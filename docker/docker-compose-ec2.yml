name: aios-ec2

networks:
  data-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.30.0.0/24

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    networks:
      data-net:
        ipv4_address: 10.30.0.20
    volumes:
      - qdrant-storage:/qdrant/storage
    ports:
      - "0.0.0.0:6333:6333"

  # mem0 is ARM64-only - build from source on amd64
  # See /aios/docker/mem0.Dockerfile for x86_64 build

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      data-net:
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "0.0.0.0:9100:9100"

volumes:
  qdrant-storage:
