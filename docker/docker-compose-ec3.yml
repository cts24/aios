name: aios-ec3

networks:
  voice-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.50.0.0/24
  vision-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.55.0.0/24

services:
  # ── VOICE ──
  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk
    restart: unless-stopped
    networks:
      voice-net:
        ipv4_address: 10.50.0.10
    volumes:
      - /aios/configs/asterisk:/etc/asterisk
    ports:
      - "0.0.0.0:5060:5060/udp"
      - "0.0.0.0:10000-10100:10000-10100/udp"

  # dograh: custom voice AI agent - build from source, not on Docker Hub
  # dograh:  image: dograh/dograh:latest  # doesn't exist

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: whisper
    restart: unless-stopped
    networks:
      voice-net:
        ipv4_address: 10.50.0.30
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    ports:
      - "0.0.0.0:9000:9000"

  # kokoro-tts: custom TTS engine - build from source, not on Docker Hub

  # ── VISION ──
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17
    container_name: frigate
    restart: unless-stopped
    privileged: true
    networks:
      vision-net:
        ipv4_address: 10.55.0.10
    volumes:
      - /aios/configs/frigate:/config
      - frigate-media:/media/frigate
    env_file:
      - /aios/.env.ec3
    ports:
      - "0.0.0.0:8554:8554"
      - "0.0.0.0:8971:8971"

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: go2rtc
    restart: unless-stopped
    networks:
      vision-net:
        ipv4_address: 10.55.0.20
    volumes:
      - /aios/configs/go2rtc:/config
    ports:
      - "0.0.0.0:1984:1984"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: unless-stopped
    networks:
      vision-net:
        ipv4_address: 10.55.0.30
    volumes:
      - /aios/configs/mosquitto:/mosquitto/config
    ports:
      - "0.0.0.0:1883:1883"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      vision-net:
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "0.0.0.0:9100:9100"

volumes:
  frigate-media:
